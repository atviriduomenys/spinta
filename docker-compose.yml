version: "3"

services:
  db:
    build: ./.docker/citus-postgis
    ports:
      # Overridable so a machine where 54321 is already taken (another spinta
      # checkout, some other postgres) can still bring this stack up.
      - "${SPINTA_DB_PORT:-54321}:5432"
    environment:
      - POSTGRES_DB=spinta
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./.docker/citus-postgis/init:/docker-entrypoint-initdb.d
  app:
    volumes:
    - ./entrypoint-internal.sh:/app/entrypoint.sh:ro
    image: spinta:local
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - ./entrypoint.sh
    environment:
      - SPINTA_CONFIG=config.yml  # TODO update actual keymap, using notes/spinta/server.sh keymap for now.
    ports:
      - "8000:8000"
    depends_on:
      - db

  redis-keymap: # sqlite faster alternative
    image: valkey/valkey:9
    restart: always
    command:
      - "valkey-server"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "always" # persistence settings to persist always, without any data loss.
    volumes:
      - redis_keymap_data:/data # persistent volume
    ports:
      - "${SPINTA_REDIS_KEYMAP_PORT:-6379}:6379"
volumes:
  postgres:
  redis_keymap_data:

networks:
  default:
    ipam:
      config:
        - subnet: 10.20.0.0/24
