# KeyCloak and Spinta credentials used by notes/auth/keycloak/test.nu.
#
# The script parses this file, so keep the format. The [client] and [user]
# sections are not a standard Spinta credentials section (Spinta's
# client-credentials and authorization-code flows against KeyCloak are
# exercised by the test script directly), they document local test setup
# values in one place. The [spinta] section mirrors the standard Spinta
# credentials format — the resource server client Spinta registers in
# KeyCloak — but is not read by any Spinta CLI in this test.

[client]
server = http://localhost:8080
client = client
secret = test-secret
scopes = uapi:/:getall

[user]
server = http://localhost:8080
user = user
secret = test-password
scopes = uapi:/:getall

[spinta]
server = http://localhost:8080
client = spinta
secret = spinta-secret
scopes =
